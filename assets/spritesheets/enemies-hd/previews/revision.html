<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enemigos · revisión de animaciones</title>
<style>body{margin:0;background:#242630;color:#eee;font:16px system-ui}header{position:sticky;top:0;background:#171923;padding:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}select,button{font:inherit;padding:8px;border:1px solid #6b7188;border-radius:6px;background:#303447;color:white}p{margin:0;color:#c5cad8;font-size:14px}main{overflow:auto}img{display:block;max-width:100%;height:auto}.real img{max-width:none}</style>
<header><h1>Enemigos revisados</h1><select aria-label="Grupo y página"><option value="enemies-I.gif">Rango I · página 1</option><option value="enemies-I-02.gif">Rango I · página 2</option><option value="enemies-I-03.gif">Rango I · página 3</option><option value="enemies-II.gif">Rango II · página 1</option><option value="enemies-II-02.gif">Rango II · página 2</option><option value="enemies-II-03.gif">Rango II · página 3</option><option value="enemies-II-04.gif">Rango II · página 4</option><option value="enemies-III.gif">Rango III · página 1</option><option value="enemies-III-02.gif">Rango III · página 2</option><option value="enemies-III-03.gif">Rango III · página 3</option><option value="enemies-IV.gif">Rango IV · página 1</option><option value="enemies-V.gif">Rango V · página 1</option><option value="enemies-bosses.gif">Jefes · página 1</option><option value="enemies-bosses-02.gif">Jefes · página 2</option><option value="enemies-bosses-03.gif">Jefes · página 3</option></select><button id="previous" aria-label="Página anterior">←</button><button id="next" aria-label="Página siguiente">→</button><button id="scale">Tamaño real</button><p>54 enemigos · reposo, daño, ataque y esquiva · pendientes de aprobación visual</p></header>
<main><img alt="Cuatro animaciones por enemigo, con escala común entre especies"></main>
<script>const s=document.querySelector('select'),im=document.querySelector('img');function show(){im.src=s.value}function move(n){s.selectedIndex=(s.selectedIndex+n+s.length)%s.length;show()}s.onchange=show;document.querySelector('#previous').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#scale').onclick=e=>{const real=document.body.classList.toggle('real');e.target.textContent=real?'Ajustar a pantalla':'Tamaño real'};show()</script></html>
