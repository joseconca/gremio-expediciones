name: Regenerar Idle original del Espadachín

on:
  push:
    branches: [main]
    paths:
      - "scripts/generar-idle-original-espadachin.py"
      - ".github/workflows/generar-idle-original-espadachin.yml"

permissions:
  contents: write

concurrency:
  group: espadachin-idle-source
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de imagen
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generar Idle masculino desde el concepto original
        run: python scripts/generar-idle-original-espadachin.py --sex m

      - name: Validar y versionar Idle masculino
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          out = Path("assets/spritesheets/originales/espadachin/idle")
          p = out / "espadachin-m-idle.png"
          with Image.open(p) as image:
              assert image.size == (256, 128), image.size
              assert image.convert("RGBA").getchannel("A").getextrema()[0] == 0
          report = json.loads((out / "qa-report-m.json").read_text(encoding="utf-8"))
          assert report["all_frames_distinct"]
          assert report["weapons_in_body"] is False
          print("QA Idle masculino: OK", report["file_sha256"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/spritesheets/originales/espadachin/idle/espadachin-m-idle.png assets/spritesheets/originales/espadachin/idle/frames/m assets/spritesheets/originales/espadachin/idle/previews/espadachin-m-idle-preview.png assets/spritesheets/originales/espadachin/idle/qa-report-m.json
          if ! git diff --cached --quiet; then
            git commit -m "art: reemplazar Idle masculino heredado por arte original"
            git push origin HEAD:main
          fi

      - name: Generar Idle femenino desde el concepto original
        run: python scripts/generar-idle-original-espadachin.py --sex f

      - name: Validar y versionar Idle femenino
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          out = Path("assets/spritesheets/originales/espadachin/idle")
          p = out / "espadachin-f-idle.png"
          with Image.open(p) as image:
              assert image.size == (256, 128), image.size
              assert image.convert("RGBA").getchannel("A").getextrema()[0] == 0
          report = json.loads((out / "qa-report-f.json").read_text(encoding="utf-8"))
          assert report["all_frames_distinct"]
          assert report["weapons_in_body"] is False
          print("QA Idle femenino: OK", report["file_sha256"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/spritesheets/originales/espadachin/idle/espadachin-f-idle.png assets/spritesheets/originales/espadachin/idle/frames/f assets/spritesheets/originales/espadachin/idle/previews/espadachin-f-idle-preview.png assets/spritesheets/originales/espadachin/idle/qa-report-f.json
          if ! git diff --cached --quiet; then
            git commit -m "art: reemplazar Idle femenino heredado por arte original"
            git push origin HEAD:main
          fi

      - name: Publicar previsualizaciones y QA
        uses: actions/upload-artifact@v4
        with:
          name: espadachin-idle-original-review
          path: |
            assets/spritesheets/originales/espadachin/idle/espadachin-m-idle.png
            assets/spritesheets/originales/espadachin/idle/espadachin-f-idle.png
            assets/spritesheets/originales/espadachin/idle/frames/**
            assets/spritesheets/originales/espadachin/idle/previews/**
            assets/spritesheets/originales/espadachin/idle/qa-report-*.json
          if-no-files-found: error
          retention-days: 14
