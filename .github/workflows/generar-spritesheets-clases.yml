name: Generar spritesheets integrados por clase

on:
  push:
    branches:
      - main
    paths:
      - "scripts/generar-spritesheets-clases.py"
      - ".github/workflows/generar-spritesheets-clases.yml"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generar solo los Novatos
        run: python scripts/generar-spritesheets-clases.py --phase novato

      - name: Validar ambas hojas de Novato
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path("public/sprites/heroes/novato").glob("novato-?-sheet.png"))
          assert len(files) == 2, f"Se esperaban 2 hojas de Novato, hay {len(files)}"
          for path in files:
              with Image.open(path) as image:
                  assert image.size == (256, 1920), (path, image.size)
                  assert image.mode == "RGBA", (path, image.mode)
                  assert image.getchannel("A").getextrema()[0] == 0, f"{path}: falta transparencia"
          print("OK: Novato masculino y femenino, 256×1920, alfa real")
          PY

      - name: Guardar los spritesheets de Novato
        run: |
          if [ -z "$(git status --porcelain -- public/sprites/heroes/novato/)" ]; then
            echo "Los spritesheets de Novato ya están actualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sprites/heroes/novato/novato-m-sheet.png public/sprites/heroes/novato/novato-f-sheet.png
          git commit -m "Rediseñar spritesheets integrados de Novato"
          git push origin HEAD:main
