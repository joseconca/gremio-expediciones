name: Generar spritesheets integrados por clase

on:
  push:
    branches:
      - main
    paths:
      - "scripts/generar-spritesheets-clases.py"
      - ".github/workflows/generar-spritesheets-clases.yml"

permissions:
  contents: write

# El generador escribe los PNG en main: impedir dos ejecuciones simultáneas.
concurrency:
  group: spritesheets-personajes-main
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Unificar expresiones y acabado de las cinco clases
        run: python scripts/generar-spritesheets-clases.py --phase all

      - name: Validar las hojas de Novato y Tier 1
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          classes = ("novato", "espadachin", "acolito", "arquero", "mago")
          files = [Path("public/sprites/heroes") / cls / f"{cls}-{sex}-sheet.png"
                   for cls in classes for sex in ("m", "f")]
          assert all(path.exists() for path in files), "Faltan hojas de Novato o Tier 1"
          for path in files:
              with Image.open(path) as image:
                  assert image.size == (256, 1920), (path, image.size)
                  assert image.mode == "RGBA", (path, image.mode)
                  assert image.getchannel("A").getextrema()[0] == 0, f"{path}: falta transparencia"
                  if path.parent.name in ("novato", "espadachin", "acolito", "arquero", "mago"):
                      hurt = image.crop((0, 2 * 128, 256, 3 * 128))
                      frames = [hurt.crop((i * 64, 0, (i + 1) * 64, 128)) for i in range(4)]
                      assert all(frame.getchannel("A").getbbox() for frame in frames), f"{path}: fotograma vacío"
                      assert len({frame.tobytes() for frame in frames}) == 4, f"{path}: Recibir daño contiene fotogramas repetidos"
                      assert all(ImageChops.difference(frames[i], frames[i + 1]).getbbox()
                                 for i in range(3)), f"{path}: transición de Recibir daño estática"
          # Las fuentes modulares de Espadachín se versionan junto con el atlas final.
          source_dir = Path("assets/spritesheets/tier1")
          classes = ("espadachin", "acolito", "arquero", "mago")
          modular_classes = [cid for cid in classes if (source_dir / f"{cid}-m-master.png").exists()]
          assert "espadachin" in modular_classes, "Faltan fuentes modulares de Espadachín"
          for cid in modular_classes:
              masters = [source_dir / f"{cid}-{sex}-master.png" for sex in ("m", "f")]
              rows = [source_dir / f"{cid}-{sex}-{anim}-row.png"
                      for sex in ("m", "f") for anim in ("idle", "walk", "hurt")]
              assert all(path.exists() for path in masters + rows), f"Faltan fuentes modulares de {cid}"
              for path in masters:
                  with Image.open(path) as image:
                      assert image.size == (64, 128) and image.mode == "RGBA", (path, image.size, image.mode)
                      assert image.getchannel("A").getextrema()[0] == 0, f"{path}: falta transparencia"
              for path in rows:
                  with Image.open(path) as image:
                      assert image.size == (256, 128) and image.mode == "RGBA", (path, image.size, image.mode)
                      assert image.getchannel("A").getextrema()[0] == 0, f"{path}: falta transparencia"
                      frames = [image.crop((i * 64, 0, (i + 1) * 64, 128)) for i in range(4)]
                      assert all(frame.getchannel("A").getbbox() for frame in frames), f"{path}: celda vacía"
                      if path.stem.endswith("-hurt-row"):
                          assert len({frame.tobytes() for frame in frames}) == 4, f"{path}: fotogramas de daño repetidos"
                      if path.stem.endswith("-idle-row"):
                          assert len({frame.tobytes() for frame in frames}) == 4, f"{path}: Idle contiene fotogramas repetidos"
                      if path.stem.endswith("-walk-row"):
                          for index, frame in enumerate(frames):
                              alpha = frame.getchannel("A")
                              seen = set()
                              for y in range(frame.height):
                                  for x in range(frame.width):
                                      if alpha.getpixel((x, y)) == 0 or (x, y) in seen:
                                          continue
                                      stack = [(x, y)]
                                      seen.add((x, y))
                                      component = []
                                      while stack:
                                          cx, cy = stack.pop()
                                          component.append((cx, cy))
                                          for ny in range(max(0, cy - 1), min(frame.height, cy + 2)):
                                              for nx in range(max(0, cx - 1), min(frame.width, cx + 2)):
                                                  if alpha.getpixel((nx, ny)) and (nx, ny) not in seen:
                                                      seen.add((nx, ny))
                                                      stack.append((nx, ny))
                                      assert not (len(component) <= 48 and max(cx for cx, _ in component) >= frame.width - 4), (
                                          f"{path}: fragmento vecino aislado en fotograma {index}"
                                      )
          print(f"OK: {len(files)} hojas completas; Espadachín modular con fuentes 64×128 y tiras 4×64×128")
          PY

      - name: Publicar artefacto de revisión visual de Novato y Espadachín
        uses: actions/upload-artifact@v4
        with:
          name: sprites-revision-tier0-tier1
          path: |
            public/sprites/heroes/novato/*-sheet.png
            public/sprites/heroes/espadachin/*-sheet.png
            public/sprites/heroes/acolito/*-sheet.png
            public/sprites/heroes/arquero/*-sheet.png
            public/sprites/heroes/mago/*-sheet.png
            assets/spritesheets/tier1/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Guardar hojas finales y fuentes modulares de Tier 1
        run: |
          if [ -z "$(git status --porcelain -- assets/spritesheets/tier1/ public/sprites/heroes/novato/ public/sprites/heroes/espadachin/ public/sprites/heroes/acolito/ public/sprites/heroes/arquero/ public/sprites/heroes/mago/)" ]; then
            echo "Los spritesheets y fuentes modulares de Novato/Tier 1 ya están actualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/spritesheets/tier1/*.png public/sprites/heroes/novato/*-sheet.png public/sprites/heroes/espadachin/*-sheet.png public/sprites/heroes/acolito/*-sheet.png public/sprites/heroes/arquero/*-sheet.png public/sprites/heroes/mago/*-sheet.png
          git commit -m "Unificar expresiones y acabado de las cinco clases iniciales"
          git push origin HEAD:main
