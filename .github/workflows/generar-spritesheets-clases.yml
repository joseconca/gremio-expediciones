name: Generar spritesheets integrados por clase

on:
  push:
    branches:
      - main
    paths:
      - "scripts/generar-spritesheets-clases.py"
      - ".github/workflows/generar-spritesheets-clases.yml"

permissions:
  contents: write

# El generador escribe los PNG en main: impedir dos ejecuciones simultáneas.
concurrency:
  group: spritesheets-personajes-main
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Unificar expresiones y acabado de las cinco clases
        run: python scripts/generar-spritesheets-clases.py --phase all

      - name: Validar integración de los sprites v2 en runtime
        run: python scripts/validar-integracion-sprites-v2.py

      - name: Validar las hojas de Novato y Tier 1
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          classes = ("novato", "espadachin", "acolito", "arquero", "mago")
          files = [Path("public/sprites/heroes") / cls / f"{cls}-{sex}-sheet.png"
                   for cls in classes for sex in ("m", "f")]
          assert all(path.exists() for path in files), "Faltan hojas de Novato o Tier 1"
          for path in files:
              with Image.open(path) as image:
                  assert image.size == (256, 1920), (path, image.size)
                  assert image.mode == "RGBA", (path, image.mode)
                  assert image.getchannel("A").getextrema()[0] == 0, f"{path}: falta transparencia"
                  if path.parent.name in ("novato", "espadachin", "acolito", "arquero", "mago"):
                      hurt = image.crop((0, 2 * 128, 256, 3 * 128))
                      frames = [hurt.crop((i * 64, 0, (i + 1) * 64, 128)) for i in range(4)]
                      assert all(frame.getchannel("A").getbbox() for frame in frames), f"{path}: fotograma vacío"
                      assert len({frame.tobytes() for frame in frames}) == 4, f"{path}: Recibir daño contiene fotogramas repetidos"
                      assert all(ImageChops.difference(frames[i], frames[i + 1]).getbbox()
                                 for i in range(3)), f"{path}: transición de Recibir daño estática"
          # Las fuentes modulares de Espadachín se versionan junto con el atlas final.
          source_dir = Path("assets/spritesheets/tier1")
          classes = ("espadachin", "acolito", "arquero", "mago")
          modular_classes = [cid for cid in classes if (source_dir / f"{cid}-m-master.png").exists()]
          assert "espadachin" in modular_classes, "Faltan fuentes modulares de Espadachín"
          for cid in modular_classes:
              for sex in ("m", "f"):
                  master_path = source_dir / f"{cid}-{sex}-master.png"
                  assert master_path.exists(), f"Falta {master_path}"
                  with Image.open(master_path) as image:
                      assert image.size == (64, 128) and image.mode == "RGBA", (master_path, image.size, image.mode)
                      assert image.getchannel("A").getextrema()[0] == 0, f"{master_path}: falta transparencia"
                  row_paths = sorted(source_dir.glob(f"{cid}-{sex}-*-row.png"))
                  required = [source_dir / f"{cid}-{sex}-{anim}-row.png" for anim in ("idle", "walk", "hurt")]
                  assert all(path.exists() for path in required), f"Faltan filas principales de {cid}/{sex}"
                  assert all(path in row_paths for path in required), f"No se detectaron las filas principales de {cid}/{sex}"
                  sheet_path = Path("public/sprites/heroes") / cid / f"{cid}-{sex}-sheet.png"
                  with Image.open(sheet_path) as sheet:
                      assert sheet.size == (256, 1920) and sheet.mode == "RGBA", (sheet_path, sheet.size, sheet.mode)
                      for path in row_paths:
                          with Image.open(path) as image:
                              assert image.size == (256, 128) and image.mode == "RGBA", (path, image.size, image.mode)
                              assert image.getchannel("A").getextrema()[0] == 0, f"{path}: falta transparencia"
                              frames = [image.crop((i * 64, 0, (i + 1) * 64, 128)) for i in range(4)]
                              assert all(frame.getchannel("A").getbbox() for frame in frames), f"{path}: celda vacía"
                              assert len({frame.tobytes() for frame in frames}) == 4, f"{path}: contiene fotogramas repetidos"
                              # Idle/Caminar/Recibir daño provienen del paquete v2 canónico.
                              # Las filas modulares antiguas siguen siendo referencia para las demás acciones.
                              if path.stem.endswith(("-idle-row", "-walk-row", "-hurt-row")):
                                  continue

                              # Todas las filas fuente deben quedar idénticas en su ubicación del atlas final.
                              row_num = {
                                  "idle": 0, "walk": 1, "hurt": 2, "consumable": 3,
                                  "dodge": 4, "block": 5, "sword": 6, "axe": 7,
                                  "spear": 8, "dagger": 9, "bow": 10, "staff": 11,
                                  "mace": 12, "book": 13, "gloves": 14,
                              }.get(path.stem.removeprefix(f"{cid}-{sex}-").removesuffix("-row"))
                              assert row_num is not None, f"{path}: fila no reconocida"
                              final_row = sheet.crop((0, row_num * 128, 256, (row_num + 1) * 128))
                              # Comparar solo lo visible: los valores RGB bajo alfa 0 no afectan al render.
                              source_visible = Image.new("RGBA", image.size, (30, 28, 34, 255))
                              final_visible = Image.new("RGBA", image.size, (30, 28, 34, 255))
                              source_visible.alpha_composite(image.convert("RGBA"))
                              final_visible.alpha_composite(final_row.convert("RGBA"))
                              assert ImageChops.difference(source_visible, final_visible).getbbox() is None, (
                                  f"{path}: la fila visible del atlas no coincide con su fuente modular"
                              )
                              if path.stem.endswith("-walk-row"):
                                  for index, frame in enumerate(frames):
                                      alpha = frame.getchannel("A")
                                      seen = set()
                                      for y in range(frame.height):
                                          for x in range(frame.width):
                                              if alpha.getpixel((x, y)) == 0 or (x, y) in seen:
                                                  continue
                                              stack = [(x, y)]
                                              seen.add((x, y))
                                              component = []
                                              while stack:
                                                  cx, cy = stack.pop()
                                                  component.append((cx, cy))
                                                  for ny in range(max(0, cy - 1), min(frame.height, cy + 2)):
                                                      for nx in range(max(0, cx - 1), min(frame.width, cx + 2)):
                                                          if alpha.getpixel((nx, ny)) and (nx, ny) not in seen:
                                                              seen.add((nx, ny))
                                                              stack.append((nx, ny))
                                              assert not (len(component) <= 48 and max(cx for cx, _ in component) >= frame.width - 4), (
                                                  f"{path}: fragmento vecino aislado en fotograma {index}"
                                              )
          anchors_path = source_dir / "weapon-anchors.json"
          assert anchors_path.exists(), "Falta weapon-anchors.json para superponer armas como capas"
          anchors = __import__("json").loads(anchors_path.read_text(encoding="utf-8"))
          assert anchors.get("schemaVersion") == 1, "Versión de esquema de anclajes inesperada"
          assert anchors.get("cellSize") == {"width": 64, "height": 128}, "Tamaño de celda inválido en anclajes"
          for cid in modular_classes:
              for sex in ("m", "f"):
                  actions = anchors.get("classes", {}).get(cid, {}).get(sex, {}).get("actions", {})
                  for action_name in ("sword", "axe", "spear", "dagger", "bow", "staff", "mace", "book", "gloves"):
                      assert action_name in actions, f"Faltan anclajes para {cid}/{sex}/{action_name}"
                      action = actions[action_name]
                      assert len(action.get("frames", [])) == 4, f"{cid}/{sex}/{action_name}: se esperan 4 anclajes"
                      for frame in action["frames"]:
                          assert 0 <= frame["x"] < 64 and 0 <= frame["y"] < 128, (
                              f"Anclaje fuera de celda: {cid}/{sex}/{action_name}/{frame}"
                          )
                          if action_name == "bow":
                              secondary = frame.get("secondaryGrip")
                              assert secondary is not None, f"Falta segundo agarre del arco: {cid}/{sex}/{frame}"
                              assert 0 <= secondary["x"] < 64 and 0 <= secondary["y"] < 128, (
                                  f"Segundo anclaje del arco fuera de celda: {cid}/{sex}/{frame}"
                              )
          print(f"OK: {len(files)} hojas completas; filas modulares y weapon-anchors.json verificados")
          PY

      - name: Publicar artefacto de revisión visual de Novato y Espadachín
        uses: actions/upload-artifact@v4
        with:
          name: sprites-revision-tier0-tier1
          path: |
            public/sprites/heroes/novato/*-sheet.png
            public/sprites/heroes/espadachin/*-sheet.png
            public/sprites/heroes/acolito/*-sheet.png
            public/sprites/heroes/arquero/*-sheet.png
            public/sprites/heroes/mago/*-sheet.png
            assets/spritesheets/tier1/*.png
            assets/spritesheets/tier1/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Guardar hojas finales y fuentes modulares de Tier 1
        run: |
          if [ -z "$(git status --porcelain -- assets/spritesheets/tier1/ public/sprites/heroes/novato/ public/sprites/heroes/espadachin/ public/sprites/heroes/acolito/ public/sprites/heroes/arquero/ public/sprites/heroes/mago/)" ]; then
            echo "Los spritesheets y fuentes modulares de Novato/Tier 1 ya están actualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/spritesheets/tier1/*.png assets/spritesheets/tier1/*.json public/sprites/heroes/novato/*-sheet.png public/sprites/heroes/espadachin/*-sheet.png public/sprites/heroes/acolito/*-sheet.png public/sprites/heroes/arquero/*-sheet.png public/sprites/heroes/mago/*-sheet.png
          git commit -m "Unificar expresiones y acabado de las cinco clases iniciales"
          git push origin HEAD:main
