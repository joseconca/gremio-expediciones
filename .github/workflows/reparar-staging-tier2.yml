name: Reparar staging Tier 2 desde frames nativos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reparar-staging-tier2.yml"
      - "scripts/reparar-staging-tier2.py"
      - "scripts/generar-propuesta-paleta-tier2.py"
      - "assets/spritesheets/originales/brujo/v2/rework-staging/m/idle-native-4f.png"
      - "assets/spritesheets/originales/brujo/v2/rework-staging/m/idle-right-4f.qa.json"
      - "assets/spritesheets/originales/brujo/v2/rework-staging/m/hurt-native-4f.png"
      - "assets/spritesheets/originales/brujo/v2/rework-staging/m/hurt-right-4f.qa.json"
      - "assets/spritesheets/originales/brujo/v2/rework-staging/f/idle-native-4f.png"
      - "assets/spritesheets/originales/brujo/v2/rework-staging/f/idle-right-4f.qa.json"

permissions:
  contents: write

concurrency:
  group: reparar-staging-tier2
  cancel-in-progress: false

jobs:
  repair:
    name: Repair and verify rework staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow

      - name: Repair derived staging strips
        run: python scripts/reparar-staging-tier2.py

      - name: Audit canonical packages and repaired staging
        run: python scripts/auditar-paquetes-tier2.py

      - name: Generate non-destructive palette harmonization candidates
        run: python scripts/generar-propuesta-paleta-tier2.py --output-dir artifacts/tier2-palette-review

      - name: Upload palette harmonization candidates
        uses: actions/upload-artifact@v4
        with:
          name: tier2-palette-harmonization-candidates
          path: artifacts/tier2-palette-review/
          if-no-files-found: error
          retention-days: 7

      - name: Upload review package for cross-class art direction
        uses: actions/upload-artifact@v4
        with:
          name: tier2-rework-staging-visual-review
          path: |
            assets/spritesheets/originales/elementalista/v2/rework-staging/
            assets/spritesheets/originales/brujo/v2/rework-staging/
            assets/spritesheets/originales/cazador/v2/rework-staging/
            assets/spritesheets/originales/explorador/v2/rework-staging/
          if-no-files-found: error
          retention-days: 7

      - name: Commit only verified staging repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/spritesheets/originales/elementalista/v2/rework-staging
          git add assets/spritesheets/originales/brujo/v2/rework-staging
          git add assets/spritesheets/originales/cazador/v2/rework-staging
          git add assets/spritesheets/originales/explorador/v2/rework-staging
          if git diff --cached --quiet; then
            echo "No derived staging strips needed repair."
          else
            git commit -m "fix(sprites): reparar tiras staging desde frames nativos"
            git push origin HEAD:main
          fi
