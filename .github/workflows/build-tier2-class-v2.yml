name: Construir spritesheets v2 de Tier 2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-tier2-class-v2.yml"
      - "assets/spritesheets/originales/caballero/v2/source/**"
      - "assets/spritesheets/originales/duelista/v2/source/**"
      - "assets/spritesheets/originales/sacerdote/v2/source/**"
      - "assets/spritesheets/originales/monje/v2/source/**"
      - "assets/spritesheets/originales/cazador/v2/source/**"
      - "assets/spritesheets/originales/explorador/v2/source/**"
      - "assets/spritesheets/originales/elementalista/v2/source/**"
      - "assets/spritesheets/originales/brujo/v2/source/**"

permissions:
  contents: write

concurrency:
  group: tier2-character-sprites-v2
  cancel-in-progress: false

jobs:
  build-tier2-masters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build and commit complete class packages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for class_id in caballero duelista sacerdote monje cazador explorador elementalista brujo; do
            source_dir="assets/spritesheets/originales/$class_id/v2/source"

            # Cazador tiene un generador raster propio, versionado por separado.
            # Generar ambos sexos solo si falta algún máster, sin SVG ni armas incrustadas.
            if [[ "$class_id" == "cazador" ]] && { [[ ! -f "$source_dir/cazador-m-core-3rows.png" ]] || [[ ! -f "$source_dir/cazador-f-core-3rows.png" ]]; }; then
              python scripts/generate-cazador-master.py
            fi

            has_f=0
            has_m=0
            [[ -f "$source_dir/$class_id-f-core-3rows.webp" || -f "$source_dir/$class_id-f-core-3rows.png" ]] && has_f=1
            [[ -f "$source_dir/$class_id-m-core-3rows.webp" || -f "$source_dir/$class_id-m-core-3rows.png" ]] && has_m=1
            if [[ "$has_f" != 1 || "$has_m" != 1 ]]; then
              echo "Skipping $class_id: upload both approved source masters before building a complete package."
              continue
            fi

            valid_masters=1
            for sex in f m; do
              if ! python - "$class_id" "$sex" "$source_dir" <<'PY'
          import hashlib, sys
          from pathlib import Path
          from PIL import Image
          cls, sex, source_dir = sys.argv[1:]
          base = Path(source_dir)
          candidates = (base / f"{cls}-{sex}-core-3rows.webp",
                        base / f"{cls}-{sex}-core-3rows.png")
          source = next((p for p in candidates if p.is_file()), None)
          if source is None:
              raise SystemExit(f"missing {cls}/{sex} source master")
          try:
              with Image.open(source) as opened:
                  image = opened.convert("RGBA")
                  if image.size not in ((128, 192), (256, 384)):
                      raise ValueError(f"invalid dimensions: {image.size}")
                  if image.getchannel("A").getextrema() != (0, 255):
                      raise ValueError("master needs real alpha transparency")
                  cw, ch = image.width // 4, image.height // 3
                  for row in range(3):
                      hashes = []
                      for col in range(4):
                          cell = image.crop((col * cw, row * ch, (col + 1) * cw, (row + 1) * ch))
                          if cell.getchannel("A").getbbox() is None:
                              raise ValueError(f"empty frame at row {row}, frame {col}")
                          hashes.append(hashlib.sha256(cell.tobytes()).hexdigest())
                      if len(set(hashes)) != 4:
                          raise ValueError(f"row {row} does not contain four distinct frames")
          except Exception as error:
              raise SystemExit(f"invalid master {source}: {error}")
          print(f"Master OK: {source} {image.size}")
          PY
              then
                valid_masters=0
              fi
            done

            if [[ "$valid_masters" != 1 ]]; then
              echo "Skipping $class_id: source validation failed; no output will be committed."
              continue
            fi

            echo "=== Building complete Tier 2 package for $class_id ==="
            for sex in f m; do
              for action in idle walk hurt; do
                python scripts/build-tier1-class-v2.py --class-id "$class_id" --sex "$sex" --action "$action"
                python - "$class_id" "$sex" "$action" <<'PY'
          import json, sys
          from pathlib import Path
          from PIL import Image
          cls, sex, action = sys.argv[1:]
          base = Path("assets/spritesheets/originales") / cls / "v2" / action
          strip = base / f"{cls}-{sex}-{action}.png"
          report = json.loads((base / f"qa-report-{sex}-{action}.json").read_text(encoding="utf-8"))
          with Image.open(strip) as opened:
              assert opened.size == (256, 128), (strip, opened.size)
              assert opened.convert("RGBA").getchannel("A").getextrema() == (0, 255), strip
          assert report["frame_count"] == 4
          assert report["distinct_frame_count"] == 4
          assert report["cell_dimensions"] == [64, 128]
          assert report["native_frame_dimensions"] == [32, 64]
          assert report["feet_baseline_drift_px"] <= (4 if action == "walk" else 2)
          assert report["runtime_integrated"] is False
          print(f"QA OK: {strip}; SHA-256={report['output_sha256']}")
          PY
              done
            done

            git add "$source_dir" "assets/spritesheets/originales/$class_id/v2/idle" "assets/spritesheets/originales/$class_id/v2/walk" "assets/spritesheets/originales/$class_id/v2/hurt"
            if ! git diff --cached --quiet; then
              git commit -m "art: versionar paquete v2 de Tier 2 para $class_id"
              git push origin HEAD:main
            fi
          done

      - name: Upload Tier 2 review package
        uses: actions/upload-artifact@v4
        with:
          name: tier2-sprites-v2-review
          path: |
            assets/spritesheets/originales/caballero/v2/
            assets/spritesheets/originales/duelista/v2/
            assets/spritesheets/originales/sacerdote/v2/
            assets/spritesheets/originales/monje/v2/
            assets/spritesheets/originales/cazador/v2/
            assets/spritesheets/originales/explorador/v2/
            assets/spritesheets/originales/elementalista/v2/
            assets/spritesheets/originales/brujo/v2/
          if-no-files-found: warn
          retention-days: 14
