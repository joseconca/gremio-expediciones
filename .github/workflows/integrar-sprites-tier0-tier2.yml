name: Integrar sprites runtime Tier 0-2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/integrar-sprites-tier0-tier2.py"
      - ".github/workflows/integrar-sprites-tier0-tier2.yml"
      - "assets/spritesheets/originales/**/v2/**"

permissions:
  contents: write

concurrency:
  group: integrar-sprites-tier0-tier2
  cancel-in-progress: false

jobs:
  integrar:
    name: Integrar y validar animaciones y retratos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Integrate canonical Tier 0-1 and Tier 2 rework staging
        run: python scripts/integrar-sprites-tier0-tier2.py --report artifacts/sprites-tier0-tier2-runtime-report.json

      - name: Upload runtime integration report
        uses: actions/upload-artifact@v4
        with:
          name: sprites-tier0-tier2-runtime-report
          path: artifacts/sprites-tier0-tier2-runtime-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Validate promoted animation rows and portrait exports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          report = json.loads(Path("artifacts/sprites-tier0-tier2-runtime-report.json").read_text(encoding="utf-8"))
          assert len(report["results"]) == 26
          for result in report["results"]:
              sheet_path = Path(result["runtime_sheet"])
              portrait_path = Path(result["portrait"])
              with Image.open(sheet_path) as sheet:
                  assert sheet.size == (256, 1920) and sheet.mode == "RGBA", (sheet_path, sheet.size, sheet.mode)
                  for row, action in enumerate(("idle", "walk", "hurt")):
                      strip = sheet.crop((0, row * 128, 256, (row + 1) * 128))
                      frames = [strip.crop((i * 64, 0, (i + 1) * 64, 128)) for i in range(4)]
                      assert all(frame.getchannel("A").getbbox() for frame in frames), (sheet_path, action, "empty frame")
                      assert len({frame.tobytes() for frame in frames}) == 4, (sheet_path, action, "duplicate frame")
              with Image.open(portrait_path) as portrait:
                  assert portrait.size == (128, 256) and portrait.mode == "RGBA", (portrait_path, portrait.size, portrait.mode)
                  assert portrait.getchannel("A").getextrema()[0] == 0, (portrait_path, "missing transparency")
                  assert portrait.getchannel("A").getbbox(), (portrait_path, "empty portrait")
              assert result["other_rows_modified"] is False
              assert result["portrait_from_svg"] is False
          print("OK: 26 atlases, 78 animation rows, 26 high-density portraits; rows 3-14 preserved.")
          PY

      - name: Commit integrated runtime atlases and portraits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/sprites/heroes/novato/ \
            public/sprites/heroes/mago/ \
            public/sprites/heroes/espadachin/ \
            public/sprites/heroes/acolito/ \
            public/sprites/heroes/arquero/ \
            public/sprites/heroes/caballero/ \
            public/sprites/heroes/duelista/ \
            public/sprites/heroes/sacerdote/ \
            public/sprites/heroes/monje/ \
            public/sprites/heroes/cazador/ \
            public/sprites/heroes/explorador/ \
            public/sprites/heroes/elementalista/ \
            public/sprites/heroes/brujo/
          if git diff --cached --quiet; then
            echo "Runtime Tier 0-2 atlases and portraits already match their sources."
          else
            git commit -m "feat(sprites): integrar Idle Walk Hurt de Tier 0-2"
            git push origin HEAD:main
          fi
