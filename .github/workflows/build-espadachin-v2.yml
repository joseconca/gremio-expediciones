name: Construir estados base v2 de Espadachín

on:
  push:
    branches: [main]
    paths:
      - "assets/spritesheets/originales/espadachin/v2/source/**"
      - "scripts/build-espadachin-v2.py"
      - ".github/workflows/build-espadachin-v2.yml"

permissions:
  contents: write

concurrency:
  group: espadachin-v2-base-actions
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generar y validar todas las acciones en un solo commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          generated=0

          for sex in f m; do
            master_png="assets/spritesheets/originales/espadachin/v2/source/espadachin-$sex-core-3rows.png"
            master_webp="assets/spritesheets/originales/espadachin/v2/source/espadachin-$sex-core-3rows.webp"
            runtime_atlas="public/sprites/heroes/espadachin/espadachin-$sex-sheet.png"
            for action in idle walk hurt; do
              source="assets/spritesheets/originales/espadachin/v2/source/espadachin-$sex-$action.webp"
              if [[ -f "$master_png" || -f "$master_webp" || -f "$source" || -f "$runtime_atlas" ]]; then
                echo "=== Espadachín $sex / $action ==="
                python scripts/build-espadachin-v2.py --sex "$sex" --action "$action"

                python - "$sex" "$action" <<'PY'
          import json, sys
          from pathlib import Path
          from PIL import Image
          sex, action = sys.argv[1:]
          base = Path("assets/spritesheets/originales/espadachin/v2")
          strip = base / action / f"espadachin-{sex}-{action}.png"
          report_path = base / action / f"qa-report-{sex}-{action}.json"
          with Image.open(strip) as image:
              assert image.size == (256, 128), (strip, image.size)
              rgba = image.convert("RGBA")
              assert rgba.getchannel("A").getextrema() == (0, 255), strip
          report = json.loads(report_path.read_text(encoding="utf-8"))
          assert report["frame_count"] == 4
          expected_distinct = 2 if action == "idle" else 4
          assert report["distinct_frame_count"] >= expected_distinct
          assert report["cell_dimensions"] == [64, 128]
          assert report["runtime_integrated"] is False
          print(f"QA OK: {strip} | {report['output_sha256']}")
          PY
                generated=1
              else
                echo "Sin fuente para $sex / $action; se omite."
              fi
            done
          done

          if [[ "$generated" == "1" ]]; then
            git add -A assets/spritesheets/originales/espadachin/v2/source/ assets/spritesheets/originales/espadachin/v2/idle/ assets/spritesheets/originales/espadachin/v2/walk/ assets/spritesheets/originales/espadachin/v2/hurt/
            if ! git diff --cached --quiet; then
              git commit -m "art: versionar paquete completo Espadachín v2"
              git push origin HEAD:main
            else
              echo "Las salidas no han cambiado; no se crea un commit vacío."
            fi
          fi

      - name: Publicar paquete de revisión
        uses: actions/upload-artifact@v4
        with:
          name: espadachin-v2-base-actions-review
          path: |
            assets/spritesheets/originales/espadachin/v2/idle
            assets/spritesheets/originales/espadachin/v2/walk
            assets/spritesheets/originales/espadachin/v2/hurt
          if-no-files-found: error
          retention-days: 14
