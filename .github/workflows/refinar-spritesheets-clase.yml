name: Refinar spritesheets por clase

on:
  push:
    branches:
      - main
    paths:
      - "scripts/refinar-spritesheets-clase.py"
      - ".github/workflows/refinar-spritesheets-clase.yml"

permissions:
  contents: write

jobs:
  refinar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas de imágenes
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Restaurar las hojas originales antes de volver a generarlas
        run: |
          BASE_SPRITES_COMMIT=f8d824b36e7ae6e59bd8f2b9474841b835125d72
          git fetch --no-tags --depth=1 origin "$BASE_SPRITES_COMMIT"
          git checkout "$BASE_SPRITES_COMMIT" -- 'public/sprites/heroes/*/*-sheet.png'
          rm -f .spritesheets-clase-refinados-v1

      - name: Crear identidad visual por clase
        run: python scripts/refinar-spritesheets-clase.py

      - name: Validar atlas
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path("public/sprites/heroes").glob("*/*-sheet.png"))
          assert len(files) == 70, f"Se esperaban 70 hojas, hay {len(files)}"
          for path in files:
              with Image.open(path) as image:
                  assert image.size == (256, 1920), f"{path}: {image.size}"
                  assert "transparency" in image.info or "A" in image.getbands(), f"{path}: falta alfa"
          print(f"OK: {len(files)} hojas, 256×1920, con transparencia")
          PY

      - name: Guardar los cambios gráficos
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No hay cambios de spritesheets que guardar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sprites/heroes/ .spritesheets-clase-refinados-v1
          git commit -m "Diferenciar visualmente los spritesheets por clase [no-sprites-refine]"
          git push origin HEAD:main
