name: Importar ilustración grande de Novato masculino

on:
  push:
    branches:
      - creacion-sprite-sheets
    paths:
      - "assets/spritesheets/hd-128x256/_staging/novato-m-illustration/READY.txt"

permissions:
  contents: write

jobs:
  import-illustration:
    # Evita reejecutar el import cuando el propio workflow elimina READY.txt.
    if: ${{ github.event.head_commit.message != 'art(sprites): conservar ilustración grande de Novato masculino' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4
        with:
          ref: creacion-sprite-sheets
          persist-credentials: true

      - name: Reensamblar, recuperar el fragmento y validar SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import struct

          staging = Path("assets/spritesheets/hd-128x256/_staging/novato-m-illustration")
          target = Path("assets/spritesheets/hd-128x256/novato/m/artwork/novato-m-character-illustration.png")
          expected_sha = "8f3532f025c1e32f9d0df2fae7ad25a61b5dc43fd86a587c7e7daa8c99896081"
          expected_bytes = 41535
          expected_b64_chars = 55380
          parts_paths = sorted(staging.glob("part-*.b64"))
          parts = [path.read_text(encoding="ascii").strip() for path in parts_paths]
          if len(parts) != 12:
              raise SystemExit(f"Expected 12 ordered base64 fragments, found {len(parts)}")

          encoded = "".join(parts)
          decoded = None
          repaired_at = None

          def try_decode(value):
              if len(value) != expected_b64_chars:
                  return None
              try:
                  raw = base64.b64decode(value, validate=True)
              except Exception:
                  return None
              if len(raw) != expected_bytes:
                  return None
              if hashlib.sha256(raw).hexdigest() != expected_sha:
                  return None
              return raw

          decoded = try_decode(encoded)
          if decoded is None and len(parts[0]) == 7004 and len(encoded) == expected_b64_chars + 4:
              # The first copied segment contains exactly four surplus contiguous
              # characters. Try each possible removal, accepting only the original
              # PNG whose complete byte hash matches the expected checksum.
              for offset in range(len(parts[0]) - 3):
                  repaired_first = parts[0][:offset] + parts[0][offset + 4:]
                  candidate = repaired_first + "".join(parts[1:])
                  decoded = try_decode(candidate)
                  if decoded is not None:
                      repaired_at = offset
                      encoded = candidate
                      break

          if decoded is None:
              raise SystemExit(
                  f"PNG reconstruction failed checksum/length validation. "
                  f"Base64 characters={len(encoded)}, expected={expected_b64_chars}; "
                  f"do not publish this file."
              )

          if decoded[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Invalid PNG signature")
          width, height = struct.unpack(">II", decoded[16:24])
          if (width, height) != (448, 1075):
              raise SystemExit(f"Unexpected dimensions: {width}x{height}")
          if decoded[25] != 3:
              raise SystemExit(f"Expected indexed PNG colour type 3, received {decoded[25]}")
          pos, has_trns = 8, False
          while pos + 12 <= len(decoded):
              size = struct.unpack(">I", decoded[pos:pos+4])[0]
              kind = decoded[pos+4:pos+8]
              if kind == b"tRNS":
                  has_trns = True
              pos += 12 + size
              if kind == b"IEND":
                  break
          if not has_trns:
              raise SystemExit("Missing PNG tRNS transparency table")

          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(decoded)
          print(
              f"Validated {width}x{height} indexed PNG; {len(decoded)} bytes; "
              f"sha256={hashlib.sha256(decoded).hexdigest()}; "
              f"recoveredExtraCharactersAt={repaired_at}"
          )
          PY

      - name: Limpiar fragmentos temporales y publicar el recurso
        run: |
          set -euo pipefail
          rm -rf assets/spritesheets/hd-128x256/_staging/novato-m-illustration
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/spritesheets/hd-128x256/novato/m/artwork/novato-m-character-illustration.png
          git add -u assets/spritesheets/hd-128x256/_staging
          git commit -m "art(sprites): conservar ilustración grande de Novato masculino"
          git push origin HEAD:creacion-sprite-sheets
