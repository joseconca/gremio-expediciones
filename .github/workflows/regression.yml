name: Regression

on:
  push:
    branches:
      - main
      - refactor-en-server-y-limpieza
      - estabilizacion-clases-objetos
      - feature/party-fase-1-core
  pull_request:
    branches:
      - main

concurrency:
  # El último commit del PR sustituye las ejecuciones obsoletas del mismo workflow.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sprites-tier2-audit:
    name: Audit Tier 2 sprite packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image audit dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate all Tier 2 source packages
        run: python scripts/auditar-paquetes-tier2.py

  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gremio_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install_deps
        run: npm ci

      - name: Generate Prisma Client
        id: prisma_generate
        run: npx prisma generate

      - name: Test base-game API route regressions
        run: npm run test:base

      - name: Test RPG progression rules
        if: ${{ always() && !cancelled() && steps.install_deps.outcome == 'success' && steps.prisma_generate.outcome == 'success' }}
        run: npm run test:progression

      - name: Test party and transfer rules
        if: ${{ always() && !cancelled() && steps.install_deps.outcome == 'success' && steps.prisma_generate.outcome == 'success' }}
        run: npm run test:party

      - name: Test combat UI components and controllers
        if: ${{ always() && !cancelled() && steps.install_deps.outcome == 'success' && steps.prisma_generate.outcome == 'success' }}
        run: npm run test:combat-ui

      - name: Test daily boss encounter rules
        if: ${{ always() && !cancelled() && steps.install_deps.outcome == 'success' && steps.prisma_generate.outcome == 'success' }}
        run: npm run test:boss-diario

      - name: Test four-frame sprite alignment
        if: ${{ always() && !cancelled() && steps.install_deps.outcome == 'success' }}
        run: npm run test:sprite-animation

      - name: Lint
        if: ${{ always() && !cancelled() && steps.install_deps.outcome == 'success' && steps.prisma_generate.outcome == 'success' }}
        run: npm run lint

      - name: Build
        if: ${{ always() && !cancelled() && steps.install_deps.outcome == 'success' && steps.prisma_generate.outcome == 'success' }}
        run: npm run build

  postgres-smoke:
    name: PostgreSQL schema and transaction smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gremio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gremio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gremio_test
    steps:
      - name: Checkout only database test files (partial Git clone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/package.json\n/package-lock.json\n/prisma/\n/tests/\n' > .git/info/sparse-checkout

          # No guardar credenciales en el remoto ni imprimirlas en el log.
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_HEADER}"

          git -c protocol.version=2 fetch --depth=1 --no-tags --filter=blob:none origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Deploy migrations on empty PostgreSQL
        run: npx prisma migrate deploy
      - name: Exercise RPG relations and versioned settlement
        run: node --test tests/postgres-integration.test.cjs
